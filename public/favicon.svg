<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="FreeCell">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6f43"/>
      <stop offset="1" stop-color="#134a2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#felt)"/>
  <!-- back card (black spade) tilted left -->
  <g transform="rotate(-12 256 300)" filter="url(#shadow)">
    <rect x="150" y="150" width="150" height="210" rx="18" fill="#ffffff"/>
    <text x="225" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="150" text-anchor="middle" fill="#1a1a1a">&#9824;</text>
  </g>
  <!-- front card (red heart) tilted right -->
  <g transform="rotate(10 256 300)" filter="url(#shadow)">
    <rect x="212" y="150" width="150" height="210" rx="18" fill="#ffffff"/>
    <text x="287" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="150" text-anchor="middle" fill="#c0392b">&#9829;</text>
  </g>
</svg>
